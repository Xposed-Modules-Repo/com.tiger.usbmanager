name: Sync from Source

on:
  # 被源仓库主动通知
  repository_dispatch:
    types: [sync-readme, sync-release, sync-all]

  # 手动触发
  workflow_dispatch:
    inputs:
      action:
        description: "同步内容"
        required: true
        type: choice
        options:
          - all
          - readme
          - release
      tag:
        description: "指定 Release tag（留空=最新）"
        required: false
        default: ""

  # 兜底轮询：每 4 小时检查一次
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

env:
  SRC_REPO: "TigerSpirit217/USBManager"

jobs:
  # ═══════════════════════════════════════
  #  Job 1: 同步 README + LICENSE
  # ═══════════════════════════════════════
  sync-docs:
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.action == 'all' ||
      github.event.inputs.action == 'readme' ||
      github.event.client_payload.action == 'sync-readme' ||
      github.event.client_payload.action == 'sync-all'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LSPosed repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch source files
        id: fetch
        run: |
          mkdir -p _src

          # 下载源仓库的 README 和 LICENSE
          curl -sfL "https://raw.githubusercontent.com/$SRC_REPO/main/README.md" \
            -o _src/README.md || echo "README 下载失败"

          curl -sfL "https://raw.githubusercontent.com/$SRC_REPO/main/LICENSE" \
            -o _src/LICENSE || echo "LICENSE 下载失败"

          # 比较是否有变化
          CHANGED=false
          for f in README.md LICENSE; do
            if [ -f "_src/$f" ]; then
              if ! diff -q "_src/$f" "$f" > /dev/null 2>&1; then
                CHANGED=true
                echo "📝 $f 有更新"
              fi
            fi
          done
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Copy & Commit
        if: steps.fetch.outputs.changed == 'true'
        run: |
          cp _src/README.md ./README.md  2>/dev/null || true
          cp _src/LICENSE   ./LICENSE    2>/dev/null || true
          rm -rf _src

          git config user.name  "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add README.md LICENSE
          git commit -m "docs: sync README & LICENSE from source ($(date -u +%Y-%m-%d))" || echo "无变更"
          git push

  # ═══════════════════════════════════════
  #  Job 2: 同步 Release
  # ═══════════════════════════════════════
  sync-release:
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.action == 'all' ||
      github.event.inputs.action == 'release' ||
      github.event.client_payload.action == 'sync-release' ||
      github.event.client_payload.action == 'sync-all'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release info
        id: resolve
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${{ github.event.client_payload.tag }}"

          if [ -z "$TAG" ]; then
            API="https://api.github.com/repos/$SRC_REPO/releases/latest"
          else
            API="https://api.github.com/repos/$SRC_REPO/releases/tags/$TAG"
          fi

          RESP=$(curl -sf "$API") || { echo "::error::获取源仓库 Release 失败"; exit 1; }

          TAG_NAME=$(echo "$RESP" | jq -r '.tag_name')
          echo "tag=$TAG_NAME"  >> "$GITHUB_OUTPUT"
          echo "name=$(echo "$RESP" | jq -r '.name // empty')" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(echo "$RESP" | jq -r '.prerelease')" >> "$GITHUB_OUTPUT"

          # body 安全写入
          {
            echo "body<<EOF_BODY"
            echo "$RESP" | jq -r '.body // ""'
            echo "EOF_BODY"
          } >> "$GITHUB_OUTPUT"

          # 提取 APK 下载链接
          echo "$RESP" | jq -r \
            '.assets[] | select(.name | test("\\.(apk|zip)$")) | .browser_download_url' \
            > apk_urls.txt

          echo "📦 源 Release: $TAG_NAME"
          wc -l < apk_urls.txt | xargs -I{} echo "   APK 数量: {}"

      - name: Check if already synced
        id: dup
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.resolve.outputs.tag }}")

          EXISTS=false
          [ "$CODE" = "200" ] && EXISTS=true
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
          echo "重复检查: ${{ steps.resolve.outputs.tag }} → $EXISTS"

      - name: Download APKs
        if: steps.dup.outputs.exists == 'false'
        run: |
          mkdir -p artifacts
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            FILENAME=$(basename "$url")
            echo "⬇️  下载 $FILENAME ..."
            curl -fSL --retry 3 -o "artifacts/$FILENAME" "$url"
          done < apk_urls.txt

          # 校验文件非空
          find artifacts/ -type f -empty -delete
          ls -lh artifacts/ 2>/dev/null || echo "无文件"

      - name: Create Release
        if: steps.dup.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name:  ${{ steps.resolve.outputs.tag }}
          name:      ${{ steps.resolve.outputs.name }}
          body:      ${{ steps.resolve.outputs.body }}
          files:     artifacts/*
          draft:     false
          prerelease: ${{ steps.resolve.outputs.prerelease == 'true' }}